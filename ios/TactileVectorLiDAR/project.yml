name: TactileVectorLiDAR
options:
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    GENERATE_INFOPLIST_FILE: 'NO'
    CODE_SIGN_STYLE: Automatic
    SUPPORTS_MACCATALYST: 'NO'
targets:
  TactileVectorLiDAR:
    type: application
    platform: iOS
    sources: [TactileVectorLiDAR]
    info:
      path: TactileVectorLiDAR/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.tactilevector.lidarprototype
        ASSETCATALOG_COMPILER_APPICON_NAME: ''
        ENABLE_USER_SCRIPT_SANDBOXING: 'YES'
