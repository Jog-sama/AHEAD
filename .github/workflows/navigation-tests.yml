name: Navigation regression tests

on:
  push:
    branches: [navigation-temporal-map-v1]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  navigation-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile navigation sources
        run: python -m compileall -q backend tests
      - name: Run navigation regression tests
        run: python -m pytest -q tests/test_navigation_map.py tests/test_arkit_depth.py tests/test_lidar_floorless.py tests/test_lidar_responsiveness.py
      - name: Run full backend test suite
        run: python -m pytest -q
      - name: Randomized LiDAR stress audit (report all critical misses)
        run: python -m scripts.stress_navigation --cases 180 --seed 20261107
