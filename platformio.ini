[platformio]
default_envs = ultrasonic

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps = h2zero/NimBLE-Arduino@^2.3.0
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; -DCANE_BATTERY_PIN=0 once a divider from the battery reaches GPIO 0 (README); unset, status says 0xFF

; JSN-SR04T, or any HC-SR04-compatible trigger and echo: TRIG 5, ECHO 6
[env:ultrasonic]

; the VL53L0X on SDA 4, SCL 3, for the bench until the ultrasonic arrives; about 2 m in the shade, less in daylight
[env:vl53l0x]
lib_deps =
    ${env.lib_deps}
    pololu/VL53L0X@^1.3.1
build_flags =
    ${env.build_flags}
    -DCANE_SENSOR_VL53L0X
