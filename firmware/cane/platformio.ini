[platformio]
default_envs = ultrasonic

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
lib_deps = h2zero/NimBLE-Arduino@^2.3.0

; the VL53L0X instead of the ultrasonic, for the bench until the ultrasonic arrives; about 2 m in the shade, less in daylight
[vl53l0x]
lib_deps =
    ${env.lib_deps}
    pololu/VL53L0X@^1.3.1
build_flags = -DCANE_SENSOR_VL53L0X

; ESP32-C3 SuperMini on its expansion board, the cane's board. Pins are main.cpp's defaults: TRIG 5, ECHO 6, SDA 4, SCL 3,
; motor 7, button 21, LED 8.
[c3]
board = esp32-c3-devkitm-1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; -DCANE_BATTERY_PIN=0 once a divider from the battery reaches GPIO 0 (README); unset, status says 0xFF

[env:ultrasonic]
extends = c3

[env:vl53l0x]
extends = c3
lib_deps = ${vl53l0x.lib_deps}
build_flags =
    ${c3.build_flags}
    ${vl53l0x.build_flags}

; ESP32 DevKit V1 (WROOM-32), the bench spare. Its serial port is a CP2102 (/dev/cu.usbserial-*), so no USB flags. 1 and 3
; are that port, 6 to 11 the flash, 0, 2, 5, 12 and 15 strapping pins, 34 to 39 input-only without pull-ups.
[devkit]
board = esp32doit-devkit-v1
build_flags =
    -DCANE_BUTTON_PIN=4
    -DCANE_GND_PIN=13  ; the button's other leg; the board has two GND pins and the sensor and buzzer take them
    -DCANE_BOOT_PIN=0
    -DCANE_TRIG_PIN=18
    -DCANE_ECHO_PIN=19
    -DCANE_SDA_PIN=21
    -DCANE_SCL_PIN=22
    -DCANE_MOTOR_PIN=23
    -DCANE_LED_PIN=2
    -DCANE_LED_ON=HIGH

[env:devkit-ultrasonic]
extends = devkit

[env:devkit-vl53l0x]
extends = devkit
lib_deps = ${vl53l0x.lib_deps}
build_flags =
    ${devkit.build_flags}
    ${vl53l0x.build_flags}

; The thumb lever's servo on this same board, as a second service beside the cane's, so the app reaches both through
; one connection. Each build names the servo pin, clear of the cane's; the safety gate (PIN_VERIFIED, POWER_VERIFIED)
; stays firmware/thumb/src/config.h's.
[thumb]
build_src_flags = -DCANE_THUMB -I../thumb/src -I../TactileVector -I../TactileVector/include

[env:devkit-vl53l0x-thumb]
extends = devkit
lib_deps = ${vl53l0x.lib_deps}
build_flags =
    ${devkit.build_flags}
    ${vl53l0x.build_flags}
    -DSERVO_PIN=26
build_src_flags = ${thumb.build_src_flags}

; GPIO 10, the C3's one exposed pin left that is neither the cane's nor a strapping or USB pin
[env:vl53l0x-thumb]
extends = c3
lib_deps = ${vl53l0x.lib_deps}
build_flags =
    ${c3.build_flags}
    ${vl53l0x.build_flags}
    -DSERVO_PIN=10
build_src_flags = ${thumb.build_src_flags}
