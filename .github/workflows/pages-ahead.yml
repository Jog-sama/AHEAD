# The Ahead app's page is also served at jonasneves.com/bridge/ahead/, from jonasneves/jonasneves.github.io's
# docs/bridge/ahead/. This job copies ios/Ahead/index.html there, and site/ (the beta form, privacy and support
# pages, at beta/, privacy/ and support/) beside it, on every change. The push uses a write deploy key on
# that one repo (secret AHEAD_PAGES_KEY), so it reaches nothing else.
name: "ios/Ahead and site/: publish to jonasneves.com"

on:
  push:
    branches: [main]
    paths: ['ios/Ahead/index.html', 'site/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5   # v4
        with:
          path: src
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5   # v4
        with:
          repository: jonasneves/jonasneves.github.io
          ssh-key: ${{ secrets.AHEAD_PAGES_KEY }}
          path: site
      # Other repos push to the same branch, so a rejected push rebases and retries.
      - name: Copy the page and push
        run: |
          mkdir -p site/docs/bridge/ahead
          cp src/ios/Ahead/index.html site/docs/bridge/ahead/index.html
          cp -R src/site/. site/docs/bridge/ahead/
          cd site
          git add docs/bridge/ahead
          if git diff --cached --quiet; then echo "already current"; exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "bridge/ahead: pages from Jog-sama/AHEAD ${GITHUB_SHA::7}"
          for i in 1 2 3 4 5; do git push -q && exit 0; git pull -q --rebase; done
          exit 1
